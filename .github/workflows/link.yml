name: Check links

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  check-links:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2024-06-10  # Используй необходимую версию

      - name: Install mdbook
        run: cargo install mdbook

      - name: Build book
        run: mdbook build

      - name: Check links with mdbook
        run: mdbook test --no-fail
