[book]
authors = ["Contributors to Ronkathon"]
language = "en"
multilingual = false
src = "book"
title = "Ronkathon: Cryptography Educational Foundations"
description = "Cryptography Educational Foundations"

[build]
build-dir = "docs"
use-default-preprocessors = true
create-missing = true

[preprocessor.katex]
after = ["links"]

[output.html]
default-theme = "dark"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/pluto/ronkathon"

[output.linkcheck]
follow-web-links = true  # Проверять внешние ссылки
traverse-parent-directories = false  # Не проверять ссылки выше корня книги
exclude = ["https://example.com"]  # Добавьте ссылки, которые нужно игнорировать
warning-policy = "warn"  # Обрабатывать предупреждения как предупреждения
